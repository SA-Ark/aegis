[package]
name = "aegis-audit"
version = "0.1.0"
edition = "2021"
description = "Production readiness audit CLI — scan a codebase or probe a live URL for security, dependency, test-debt, and configuration risk before it ships."
license = "MIT"
repository = "https://github.com/SA-Ark/aegis"
keywords = ["audit", "security", "production", "readiness", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "aegis"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
anyhow = "1"
ureq = { version = "2", features = ["tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
